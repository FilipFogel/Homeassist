name: Bygg APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Förbered Gradle (med cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Bygg debug-APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Spara APK som artifact
        uses: actions/upload-artifact@v4
        with:
          name: hemma-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Lägger senaste bygget från main under Releases → "senaste",
      # så att APK:n kan laddas ner direkt i telefonen utan zip.
      - name: Publicera som release "senaste"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk hemma.apk
          gh release delete senaste --yes --cleanup-tag || true
          gh release create senaste hemma.apk \
            --title "Hemma – senaste bygget" \
            --notes "Byggd automatiskt från ${GITHUB_SHA::7}. Ladda ner hemma.apk på telefonen och installera." \
            --target "$GITHUB_SHA" \
            --latest
